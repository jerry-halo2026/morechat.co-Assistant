interface:
  display_name: "长视频结构化与混剪执行"
  short_description: "AI视频剪辑：视觉方向与证据校准、Proof生产锁、Blender/FFmpeg可验证交付"
  default_prompt: "使用 $long-video-remix：每轮续接按 references/workflow-control.md 恢复项目与待确认关口，依赖动作前运行 guard，交接保留状态；先完成 Broad Structure 的正式文字化观察层与 Content Map，由 Director 确认 Narrative Direction；再做 Detail Structure，以字幕 / signals 优先补足最小充分证据，不为候选区间默认全量 ASR，并保留 selection-ready 边界，随真实关键帧与自包含 handoff 交回 Director 确认 Execution Package（计划与制作 reference）；一两个样本锁定全片风格。Execute 先用 Step 0 只精校 D2 入选片段及 handles、把 boundary 升为 supported，再落实已确认包，QA 核查 Reference Compliance。保持完整基础观察、稳定 source-time 标签与两次 Direct 边界。 D2 依 references/visual-production.md 交付方法，并只对 `proof_composition_ids` 中最小充分的代表性集合做 Blender 工程、连续动态 demo 与 proof；非 proof 段必须由机器校验 `proof_covered_by` 覆盖关系；其他同类 production compositions 延后到最终授权后一次性渲染，不逐段预出 demo；视觉方案不足时先按 references/visual-methods/index.md 路由并读取完整命中方法 / fallback；公开版的新项目采用视觉设计时按 references/visual-reference-router.md 执行 visual/V0→V7：V2 按问题记录当前素材如何校准方向，V3 先做 Art Direction 再定参数，V5 完成证据化比较后停给用户，V6 只绑定用户真实选择及实际展示 artifact，V7 冻结方案；visual-methods 只记录实现方法，不重复保存 Reference Selection；Visual Reference 不推导偏好，V6 复用现有 Mockup 决定而不新增审批次数；真实审阅并确认后生成 Production Lock，冻结当前 Blender/FFmpeg 实现入口、关键视觉规则、delivery spec、文字/旁白 policy，才回接 FFmpeg；未实现或未观看保持 pending；局部修订继承已确认方法与项目值，按最新 Narrative 用 adapt 同步具名参数；非参数内容先 revise 声明范围，由原 plan 确认实际 diff，只重算实际受影响验证。"
policy:
  allow_implicit_invocation: true
